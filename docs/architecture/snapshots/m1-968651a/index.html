 → scene.input → EventRouter<\/text>\n<text class=\"muted\" x=\"518\" y=\"213\" font-size=\"12\">2 · flow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L539\" target=\"_blank\" rel=\"noopener\" data-node=\"idle\"><title>renderReady возвращается, пока вывод не завершён или не наступил срок cadence. Без dirty-request он возвращается до подготовки и paint. Idle продолжает проверять input и resize; периодического кадра без invalidation нет. Опоздание цикла не вызывает догоняющую серию кадров.<\/title>\n<rect class=\"card\" x=\"498\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#08796b\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#08796b\"/>\n<text class=\"ink\" x=\"518\" y=\"300\" font-size=\"20\" font-weight=\"650\">3. Проверить dirty и вывод<\/text>\n<text class=\"muted\" x=\"518\" y=\"358\" font-size=\"14\">pending? / cadence? / Invalidation::NONE?<\/text>\n<text class=\"muted\" x=\"518\" y=\"403\" font-size=\"12\">3 · flow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L522\" target=\"_blank\" rel=\"noopener\" data-node=\"prepare-frame\"><title>Подготовка сцены синхронизирует bindings и удерживает ревизии моделей. Подготовленные views используют итоговую геометрию layout; layout-invalidation при подготовке может повторить ограниченный проход. Квитанции provider requests обрабатываются вне paint. Подготовка не запускает скрытый provider worker.<\/title>\n<rect class=\"card\" x=\"22\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#08796b\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#08796b\"/>\n<text class=\"ink\" x=\"42\" y=\"300\" font-size=\"20\" font-weight=\"650\">4. Подготовить согласованные<\/text>\n<text class=\"ink\" x=\"42\" y=\"324\" font-size=\"20\" font-weight=\"650\">views<\/text>\n<text class=\"muted\" x=\"42\" y=\"358\" font-size=\"14\">scene.prepare → layout snapshot →<\/text>\n<text class=\"muted\" x=\"42\" y=\"377\" font-size=\"14\">prepareViews<\/text>\n<text class=\"muted\" x=\"42\" y=\"403\" font-size=\"12\">4 · flow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L454\" target=\"_blank\" rel=\"noopener\" data-node=\"paint\"><title>Видимые узлы рисуют через arranged surfaces и clips внутри WidgetTree::frame. Renderer преобразует заимствованные команды во владеющие cells. Ошибка prepare/render завершает run с исходной причиной; runner не отправляет частично построенный кадр. Само рисование tree не откатывает предыдущие эффекты callback.<\/title>\n<rect class=\"card\" x=\"22\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#08796b\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#08796b\"/>\n<text class=\"ink\" x=\"42\" y=\"490\" font-size=\"20\" font-weight=\"650\">5. Layout и paint<\/text>\n<text class=\"muted\" x=\"42\" y=\"548\" font-size=\"14\">WidgetTree::frame → renderer → CellBuffer<\/text>\n<text class=\"muted\" x=\"42\" y=\"593\" font-size=\"12\">5 · flow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L582\" target=\"_blank\" rel=\"noopener\" data-node=\"output\"><title>FrameWriter удерживает частичный вывод и меняет committed state только после полного согласованного принятия. Обновление может дать пустой diff. Любая транспортная ошибка завершает этот run; неопределённые байты не переотправляются и transport не открывается повторно. Flush выполняется не чаще раза за цикл.<\/title>\n<rect class=\"card\" x=\"498\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#1759a8\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#1759a8\"/>\n<text class=\"ink\" x=\"518\" y=\"490\" font-size=\"20\" font-weight=\"650\">6. Отправить и дописать<\/text>\n<text class=\"muted\" x=\"518\" y=\"548\" font-size=\"14\">FrameWriter: diff → encode → bounded flush<\/text>\n<text class=\"muted\" x=\"518\" y=\"593\" font-size=\"12\">6 · owner · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L610\" target=\"_blank\" rel=\"noopener\" data-node=\"eof\"><title>EOF завершает decoding, доставляет допущенный CONTROL и дописывает отправленный вывод. Он не ждёт будущих кадров, timers или DATA: доставленное изменение может остаться dirty и не отобразиться. Cancellation может остановить раньше. Native close зависит от host/driver progress.<\/title>\n<rect class=\"card\" x=\"498\" y=\"650\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"650\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"680\" font-size=\"20\" font-weight=\"650\">Ограничения EOF и cancellation<\/text>\n<text class=\"muted\" x=\"518\" y=\"738\" font-size=\"14\">EOF ≠ render all future work<\/text>\n<text class=\"muted\" x=\"518\" y=\"783\" font-size=\"12\">7 · status · source ↗<\/text><\/a>\n<\/svg>\n", "errors-en.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 860\" role=\"img\" aria-labelledby=\"title desc\">\n<title id=\"title\">Failure collection and policy<\/title>\n<desc id=\"desc\">M1 in progress · committed source baseline. Red cards mark failure boundaries. Collector, observer and final sink have different lifetimes and effects. Reporting an error alone does not choose recovery.<\/desc>\n<style>text{font-family:system-ui,Segoe UI,sans-serif} .paper{fill:#f5f7fc}.card{fill:#fff}.ink{fill:#17233a}.muted{fill:#42516a} a:focus rect{stroke-width:5} @media(prefers-color-scheme:dark){.paper{fill:#121b2b}.card{fill:#1c2a40}.ink{fill:#f2f5fc}.muted{fill:#d2dced}}<\/style>\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#7387a8\"/><\/marker><\/defs>\n<rect class=\"paper\" width=\"960\" height=\"860\" rx=\"12\"/>\n<text class=\"ink\" x=\"22\" y=\"32\" font-size=\"23\" font-weight=\"700\">Failure collection and policy<\/text>\n<text class=\"muted\" x=\"22\" y=\"58\" font-size=\"14\">m1-968651a · M1 in progress · committed source baseline<\/text>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/include/portals/managed_diagnostics.hpp#L53\" target=\"_blank\" rel=\"noopener\" data-node=\"typed\"><title>Checked operations return expected. ManagedError retains phase, node, original tree/style/application cause and optional exact text/resource details. ApplicationError keeps the primary phase/cause and separate restoration. Optional independent application and cleanup details do not overwrite the primary managed cause.<\/title>\n<rect class=\"card\" x=\"22\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"42\" y=\"110\" font-size=\"20\" font-weight=\"650\">Typed cause and provenance<\/text>\n<text class=\"muted\" x=\"42\" y=\"168\" font-size=\"14\">ManagedError / ApplicationError<\/text>\n<text class=\"muted\" x=\"42\" y=\"213\" font-size=\"12\">1 · error · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/widgets/managed.cpp#L616\" target=\"_blank\" rel=\"noopener\" data-node=\"collect\"><title>Explicit reportError records and notifies, without requesting a frame or stopping the runner. History retains the oldest errors up to maxErrors; overflow increments droppedErrors. Context count and bytes are bounded. Owning diagnostics snapshots remain inspectable after close.<\/title>\n<rect class=\"card\" x=\"498\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#1759a8\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#1759a8\"/>\n<text class=\"ink\" x=\"518\" y=\"110\" font-size=\"20\" font-weight=\"650\">Bounded collector<\/text>\n<text class=\"muted\" x=\"518\" y=\"168\" font-size=\"14\">ManagedScene::reportError / diagnostics<\/text>\n<text class=\"muted\" x=\"518\" y=\"213\" font-size=\"12\">2 · owner · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/managed-controls.md#L261\" target=\"_blank\" rel=\"noopener\" data-node=\"observer\"><title>Immediate managed notifications run on UI after recording, before terminal restoration; the diagnostic is borrowed for the call. A throw marks observerFailed without replacing the cause. Nested reports do not recurse; mutation/clear/drain/close are rejected during notification. No managed observer runs after close. The fluent facade can use a fallback observer when no live managed collector can deliver the primary, including a pre-owner setup failure after its cleanup attempt.<\/title>\n<rect class=\"card\" x=\"498\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#7045a1\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#7045a1\"/>\n<text class=\"ink\" x=\"518\" y=\"300\" font-size=\"20\" font-weight=\"650\">Synchronous observer<\/text>\n<text class=\"muted\" x=\"518\" y=\"358\" font-size=\"14\">onError(ManagedDiagnostic const&amp;)<\/text>\n<text class=\"muted\" x=\"518\" y=\"403\" font-size=\"12\">3 · borrow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/managed-controls.md#L204\" target=\"_blank\" rel=\"noopener\" data-node=\"recover\"><title>Applications may handle a returned checked error and explicitly report it while continuing. Collector inspection or draining does not clear a latched runtime failure. Recovery must respect the operation contract; there is no automatic widget replacement or retry of uncertain output.<\/title>\n<rect class=\"card\" x=\"22\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#08796b\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#08796b\"/>\n<text class=\"ink\" x=\"42\" y=\"300\" font-size=\"20\" font-weight=\"650\">Explicit recovery policy<\/text>\n<text class=\"muted\" x=\"42\" y=\"358\" font-size=\"14\">expected handling / explicit reportError<\/text>\n<text class=\"muted\" x=\"42\" y=\"403\" font-size=\"12\">4 · flow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/widgets/ui_scene.cpp#L761\" target=\"_blank\" rel=\"noopener\" data-node=\"fatal\"><title>Managed runtime failure uses the first-failure path and requests orderly shutdown. Short rejected setup mutations latch their original typed cause before observers and stop later configuration. Callback exceptions translate to boundary errors. Failure of the observer does not turn a fatal result into success.<\/title>\n<rect class=\"card\" x=\"22\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"42\" y=\"490\" font-size=\"20\" font-weight=\"650\">Latched failure and stop<\/text>\n<text class=\"muted\" x=\"42\" y=\"548\" font-size=\"14\">setup short mutation / managed runtime<\/text>\n<text class=\"muted\" x=\"42\" y=\"567\" font-size=\"14\">failure<\/text>\n<text class=\"muted\" x=\"42\" y=\"593\" font-size=\"12\">5 · error · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L788\" target=\"_blank\" rel=\"noopener\" data-node=\"primary-cleanup\"><title>Cleanup is attempted after failure, including partial construction. Application retains the first phase/cause plus separate terminal restoration; it does not collect every later exception. Managed wrappers retain independent cleanup details and shutdown diagnostics. Resource cleanup does not roll back domain effects. OS and screen restoration have separate limitations; native close has no hard deadline.<\/title>\n<rect class=\"card\" x=\"498\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"518\" y=\"490\" font-size=\"20\" font-weight=\"650\">Preserve cleanup evidence<\/text>\n<text class=\"muted\" x=\"518\" y=\"548\" font-size=\"14\">stop → close → primary + restoration +<\/text>\n<text class=\"muted\" x=\"518\" y=\"567\" font-size=\"14\">cleanup<\/text>\n<text class=\"muted\" x=\"518\" y=\"593\" font-size=\"12\">6 · error · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/include/portals/ui_scene.hpp#L21\" target=\"_blank\" rel=\"noopener\" data-node=\"sink\"><title>The final SceneReport carries a typed final failure or bounded retained/dropped counts after the run/cleanup boundary; full details remain in diagnostics(). The sink borrows the report for its call only. A thrown sink falls back to stderr with the original report. Direct run callers inspect expected and choose reporting.<\/title>\n<rect class=\"card\" x=\"498\" y=\"650\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"650\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"518\" y=\"680\" font-size=\"20\" font-weight=\"650\">Final application sink<\/text>\n<text class=\"muted\" x=\"518\" y=\"738\" font-size=\"14\">reportOnError / runApp / stderr default<\/text>\n<text class=\"muted\" x=\"518\" y=\"783\" font-size=\"12\">7 · error · source ↗<\/text><\/a>\n<\/svg>\n", "errors-ru.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 860\" role=\"img\" aria-labelledby=\"title desc\">\n<title id=\"title\">Сбор ошибок и политика<\/title>\n<desc id=\"desc\">M1 в работе · закреплённая версия исходников. Красные карточки отмечают границы ошибок. Collector, observer и итоговый sink имеют разные lifetime и эффекты. Само сообщение об ошибке не выбирает recovery.<\/desc>\n<style>text{font-family:system-ui,Segoe UI,sans-serif} .paper{fill:#f5f7fc}.card{fill:#fff}.ink{fill:#17233a}.muted{fill:#42516a} a:focus rect{stroke-width:5} @media(prefers-color-scheme:dark){.paper{fill:#121b2b}.card{fill:#1c2a40}.ink{fill:#f2f5fc}.muted{fill:#d2dced}}<\/style>\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#7387a8\"/><\/marker><\/defs>\n<rect class=\"paper\" width=\"960\" height=\"860\" rx=\"12\"/>\n<text class=\"ink\" x=\"22\" y=\"32\" font-size=\"23\" font-weight=\"700\">Сбор ошибок и политика<\/text>\n<text class=\"muted\" x=\"22\" y=\"58\" font-size=\"14\">m1-968651a · M1 в работе · закреплённая версия исходников<\/text>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/include/portals/managed_diagnostics.hpp#L53\" target=\"_blank\" rel=\"noopener\" data-node=\"typed\"><title>Проверяемые операции возвращают expected. ManagedError сохраняет phase, node, исходную tree/style/application cause и точные text/resource details. ApplicationError хранит primary phase/cause отдельно от restoration. Независимые application и cleanup details не подменяют исходную managed cause.<\/title>\n<rect class=\"card\" x=\"22\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"42\" y=\"110\" font-size=\"20\" font-weight=\"650\">Типизированная причина и<\/text>\n<text class=\"ink\" x=\"42\" y=\"134\" font-size=\"20\" font-weight=\"650\">источник<\/text>\n<text class=\"muted\" x=\"42\" y=\"168\" font-size=\"14\">ManagedError / ApplicationError<\/text>\n<text class=\"muted\" x=\"42\" y=\"213\" font-size=\"12\">1 · error · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/widgets/managed.cpp#L616\" target=\"_blank\" rel=\"noopener\" data-node=\"collect\"><title>Явный reportError сохраняет и уведомляет, не запрашивая кадр и не останавливая runner. История удерживает старые ошибки до maxErrors; overflow увеличивает droppedErrors. Количество contexts и bytes ограничено. Владеющие diagnostics snapshots доступны для чтения после close.<\/title>\n<rect class=\"card\" x=\"498\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#1759a8\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#1759a8\"/>\n<text class=\"ink\" x=\"518\" y=\"110\" font-size=\"20\" font-weight=\"650\">Ограниченный collector<\/text>\n<text class=\"muted\" x=\"518\" y=\"168\" font-size=\"14\">ManagedScene::reportError / diagnostics<\/text>\n<text class=\"muted\" x=\"518\" y=\"213\" font-size=\"12\">2 · owner · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/managed-controls.md#L261\" target=\"_blank\" rel=\"noopener\" data-node=\"observer\"><title>Немедленные managed-уведомления выполняются в UI после записи, до восстановления терминала; diagnostic заимствован на время вызова. Исключение отмечает observerFailed, сохраняя причину. Вложенные reports не вызывают рекурсию; mutation/clear/drain/close отклоняются во время уведомления. После close managed observer не вызывается. Fluent-фасад может использовать fallback observer, когда живой managed collector не может доставить primary, в том числе для setup-ошибки до создания владельца после попытки cleanup.<\/title>\n<rect class=\"card\" x=\"498\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#7045a1\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#7045a1\"/>\n<text class=\"ink\" x=\"518\" y=\"300\" font-size=\"20\" font-weight=\"650\">Синхронный observer<\/text>\n<text class=\"muted\" x=\"518\" y=\"358\" font-size=\"14\">onError(ManagedDiagnostic const&amp;)<\/text>\n<text class=\"muted\" x=\"518\" y=\"403\" font-size=\"12\">3 · borrow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/managed-controls.md#L204\" target=\"_blank\" rel=\"noopener\" data-node=\"recover\"><title>Приложение может обработать возвращённую checked-ошибку и явно сообщить её, продолжая работу. Чтение или drain collector не снимает сохранённую runtime-ошибку. Recovery соблюдает контракт операции; автоматической замены виджета или повтора неопределённого вывода нет.<\/title>\n<rect class=\"card\" x=\"22\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#08796b\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#08796b\"/>\n<text class=\"ink\" x=\"42\" y=\"300\" font-size=\"20\" font-weight=\"650\">Явная политика recovery<\/text>\n<text class=\"muted\" x=\"42\" y=\"358\" font-size=\"14\">expected handling / explicit reportError<\/text>\n<text class=\"muted\" x=\"42\" y=\"403\" font-size=\"12\">4 · flow · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/widgets/ui_scene.cpp#L761\" target=\"_blank\" rel=\"noopener\" data-node=\"fatal\"><title>Managed runtime failure сохраняет первую ошибку и запрашивает упорядоченное завершение. Короткие отклонённые setup-изменения сохраняют исходную типизированную причину до observers и останавливают последующие настройки. Исключения callback преобразуются в ошибки границы. Сбой observer не превращает fatal result в успех.<\/title>\n<rect class=\"card\" x=\"22\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"42\" y=\"490\" font-size=\"20\" font-weight=\"650\">Сохранённая ошибка и stop<\/text>\n<text class=\"muted\" x=\"42\" y=\"548\" font-size=\"14\">setup short mutation / managed runtime<\/text>\n<text class=\"muted\" x=\"42\" y=\"567\" font-size=\"14\">failure<\/text>\n<text class=\"muted\" x=\"42\" y=\"593\" font-size=\"12\">5 · error · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/runtime/application.cpp#L788\" target=\"_blank\" rel=\"noopener\" data-node=\"primary-cleanup\"><title>Cleanup выполняется после ошибки, включая частичное создание. Application хранит первую phase/cause и отдельно terminal restoration; он не собирает все последующие исключения. Managed-обёртки сохраняют независимые cleanup details и shutdown diagnostics. Освобождение ресурсов не откатывает domain effects. Восстановление OS и экрана имеет отдельные ограничения; у native close нет жёсткого deadline.<\/title>\n<rect class=\"card\" x=\"498\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"518\" y=\"490\" font-size=\"20\" font-weight=\"650\">Сохранить ошибки cleanup<\/text>\n<text class=\"muted\" x=\"518\" y=\"548\" font-size=\"14\">stop → close → primary + restoration +<\/text>\n<text class=\"muted\" x=\"518\" y=\"567\" font-size=\"14\">cleanup<\/text>\n<text class=\"muted\" x=\"518\" y=\"593\" font-size=\"12\">6 · error · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/include/portals/ui_scene.hpp#L21\" target=\"_blank\" rel=\"noopener\" data-node=\"sink\"><title>Итоговый SceneReport передаёт типизированную итоговую ошибку или ограниченные retained/dropped counts после границы run/cleanup; полные details остаются в diagnostics(). Sink заимствует report только на время вызова. Исключение sink вызывает fallback в stderr с исходным report. Вызывающий прямой run проверяет expected и выбирает способ сообщения.<\/title>\n<rect class=\"card\" x=\"498\" y=\"650\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#a33b27\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"650\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#a33b27\"/>\n<text class=\"ink\" x=\"518\" y=\"680\" font-size=\"20\" font-weight=\"650\">Итоговый sink приложения<\/text>\n<text class=\"muted\" x=\"518\" y=\"738\" font-size=\"14\">reportOnError / runApp / stderr default<\/text>\n<text class=\"muted\" x=\"518\" y=\"783\" font-size=\"12\">7 · error · source ↗<\/text><\/a>\n<\/svg>\n", "milestones-en.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 670\" role=\"img\" aria-labelledby=\"title desc\">\n<title id=\"title\">Milestone evidence and remaining work<\/title>\n<desc id=\"desc\">M1 in progress · committed source baseline. This is an in-progress M1 source snapshot. It is not milestone acceptance or a release declaration. Earlier baseline and current changes are pinned; future snapshots are a maintenance process.<\/desc>\n<style>text{font-family:system-ui,Segoe UI,sans-serif} .paper{fill:#f5f7fc}.card{fill:#fff}.ink{fill:#17233a}.muted{fill:#42516a} a:focus rect{stroke-width:5} @media(prefers-color-scheme:dark){.paper{fill:#121b2b}.card{fill:#1c2a40}.ink{fill:#f2f5fc}.muted{fill:#d2dced}}<\/style>\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#7387a8\"/><\/marker><\/defs>\n<rect class=\"paper\" width=\"960\" height=\"670\" rx=\"12\"/>\n<text class=\"ink\" x=\"22\" y=\"32\" font-size=\"23\" font-weight=\"700\">Milestone evidence and remaining work<\/text>\n<text class=\"muted\" x=\"22\" y=\"58\" font-size=\"14\">m1-968651a · M1 in progress · committed source baseline<\/text>\n<a href=\"https://github.com/ttldtor/portals/blob/849dc6285d7ef863206e8248810ee0650413b0a2/docs/compile-time-pss.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"baseline\"><title>The earlier comparison revision already contains typed styles/PSS integration. The public foundation does not claim to publish or independently qualify a historical M0 snapshot. Use the pinned revision for source comparison; the current cards describe 968651a.<\/title>\n<rect class=\"card\" x=\"22\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"42\" y=\"110\" font-size=\"20\" font-weight=\"650\">Earlier source baseline<\/text>\n<text class=\"muted\" x=\"42\" y=\"168\" font-size=\"14\">M0 comparison:<\/text>\n<text class=\"muted\" x=\"42\" y=\"187\" font-size=\"14\">849dc6285d7ef863206e8248810ee0650413b0a2<\/text>\n<text class=\"muted\" x=\"42\" y=\"213\" font-size=\"12\">1 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/input.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"keys\"><title>The current committed source has semantic key bindings, press/repeat/release selection, bounded key sequences and scoped quit commands. These additions use the existing router and scheduler. This statement covers these source features, not all M1 work.<\/title>\n<rect class=\"card\" x=\"498\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"110\" font-size=\"20\" font-weight=\"650\">Delivered since the baseline<\/text>\n<text class=\"muted\" x=\"518\" y=\"168\" font-size=\"14\">semantic keys / phase selection /<\/text>\n<text class=\"muted\" x=\"518\" y=\"187\" font-size=\"14\">sequences<\/text>\n<text class=\"muted\" x=\"518\" y=\"213\" font-size=\"12\">2 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/widgets/ui_scene.cpp#L761\" target=\"_blank\" rel=\"noopener\" data-node=\"setup-change\"><title>Since the earlier baseline, rejected short setup mutations retain typed failure and stop subsequent configure callbacks. This corrects the older limitation where a void configure could record the diagnostic without stopping setup. Current snapshot follows the corrected contract.<\/title>\n<rect class=\"card\" x=\"498\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"300\" font-size=\"20\" font-weight=\"650\">Setup failure propagation<\/text>\n<text class=\"muted\" x=\"518\" y=\"358\" font-size=\"14\">first rejected short setup mutation → stop<\/text>\n<text class=\"muted\" x=\"518\" y=\"403\" font-size=\"12\">3 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/include/portals/ui.hpp#L1980\" target=\"_blank\" rel=\"noopener\" data-node=\"launch-change\"><title>Lazy CLI launch can show help without constructing the scene factory. Fluent stages still prepare and run the same retained core. Single UI-thread ownership, checked observing handles, dirty-only frames and explicit cleanup remain the core invariants.<\/title>\n<rect class=\"card\" x=\"22\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"42\" y=\"300\" font-size=\"20\" font-weight=\"650\">Lazy launch and retained core<\/text>\n<text class=\"muted\" x=\"42\" y=\"358\" font-size=\"14\">ui::launch + same Application / tree /<\/text>\n<text class=\"muted\" x=\"42\" y=\"377\" font-size=\"14\">router<\/text>\n<text class=\"muted\" x=\"42\" y=\"403\" font-size=\"12\">4 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/planned-features.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"remaining\"><title>This source baseline does not include uncommitted range composition, named references/scoped style changes or later controls/focus work. Their delivery and verification are separate. Update the architecture only from integrated, checked source; do not mark the whole milestone complete from this foundation.<\/title>\n<rect class=\"card\" x=\"22\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"42\" y=\"490\" font-size=\"20\" font-weight=\"650\">M1 remains in progress<\/text>\n<text class=\"muted\" x=\"42\" y=\"548\" font-size=\"14\">Concurrent and future changes require a<\/text>\n<text class=\"muted\" x=\"42\" y=\"567\" font-size=\"14\">new snapshot<\/text>\n<text class=\"muted\" x=\"42\" y=\"593\" font-size=\"12\">5 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/testing.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"checks\"><title>Baseline integration: PR36 CI run 38799649714 completed 6/6 checks successfully for PR head 28723ed04810c597c2fe31f0d75cd9416c5916ac, merged as 968651a. Snapshot authoring separately passed 8 exporter/source/help tests and 40 offline browser map/language/theme/width combinations, including actual SVG downloads. These are documentation checks, not a new C++ runtime suite. New full Doxygen build and delivered artifact: NOT_VERIFIED at authoring boundary; integration remains required.<\/title>\n<rect class=\"card\" x=\"498\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"490\" font-size=\"20\" font-weight=\"650\">Named verification evidence<\/text>\n<text class=\"muted\" x=\"518\" y=\"548\" font-size=\"14\">Baseline CI 6/6 / exporter 8 / browser 40<\/text>\n<text class=\"muted\" x=\"518\" y=\"593\" font-size=\"12\">6 · status · source ↗<\/text><\/a>\n<\/svg>\n", "milestones-ru.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 670\" role=\"img\" aria-labelledby=\"title desc\">\n<title id=\"title\">Milestones: факты и оставшаяся работа<\/title>\n<desc id=\"desc\">M1 в работе · закреплённая версия исходников. Это снимок исходников внутри M1. Он не означает приёмку milestone или выпуск. Предыдущая база и текущие изменения закреплены; будущие snapshots — процесс сопровождения.<\/desc>\n<style>text{font-family:system-ui,Segoe UI,sans-serif} .paper{fill:#f5f7fc}.card{fill:#fff}.ink{fill:#17233a}.muted{fill:#42516a} a:focus rect{stroke-width:5} @media(prefers-color-scheme:dark){.paper{fill:#121b2b}.card{fill:#1c2a40}.ink{fill:#f2f5fc}.muted{fill:#d2dced}}<\/style>\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#7387a8\"/><\/marker><\/defs>\n<rect class=\"paper\" width=\"960\" height=\"670\" rx=\"12\"/>\n<text class=\"ink\" x=\"22\" y=\"32\" font-size=\"23\" font-weight=\"700\">Milestones: факты и оставшаяся работа<\/text>\n<text class=\"muted\" x=\"22\" y=\"58\" font-size=\"14\">m1-968651a · M1 в работе · закреплённая версия исходников<\/text>\n<a href=\"https://github.com/ttldtor/portals/blob/849dc6285d7ef863206e8248810ee0650413b0a2/docs/compile-time-pss.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"baseline\"><title>Предыдущая сравниваемая ревизия уже содержит typed styles/PSS integration. Публичная foundation не объявляет исторический M0 snapshot опубликованным или независимо проверенным. Для сравнения используйте закреплённую ревизию; текущие карточки описывают 968651a.<\/title>\n<rect class=\"card\" x=\"22\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"42\" y=\"110\" font-size=\"20\" font-weight=\"650\">Предыдущая исходная база<\/text>\n<text class=\"muted\" x=\"42\" y=\"168\" font-size=\"14\">M0 comparison:<\/text>\n<text class=\"muted\" x=\"42\" y=\"187\" font-size=\"14\">849dc6285d7ef863206e8248810ee0650413b0a2<\/text>\n<text class=\"muted\" x=\"42\" y=\"213\" font-size=\"12\">1 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/input.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"keys\"><title>Текущая закреплённая версия содержит semantic key bindings, выбор press/repeat/release, ограниченные key sequences и scoped quit commands. Дополнения используют существующие router и scheduler. Это статус перечисленных возможностей исходников, не всего M1.<\/title>\n<rect class=\"card\" x=\"498\" y=\"80\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"80\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"110\" font-size=\"20\" font-weight=\"650\">Реализовано после базы<\/text>\n<text class=\"muted\" x=\"518\" y=\"168\" font-size=\"14\">semantic keys / phase selection /<\/text>\n<text class=\"muted\" x=\"518\" y=\"187\" font-size=\"14\">sequences<\/text>\n<text class=\"muted\" x=\"518\" y=\"213\" font-size=\"12\">2 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/src/widgets/ui_scene.cpp#L761\" target=\"_blank\" rel=\"noopener\" data-node=\"setup-change\"><title>После предыдущей базы короткие отклонённые setup-изменения сохраняют типизированную ошибку и останавливают следующие configure. Это исправляет прежнее ограничение, когда void configure мог записать diagnostic без остановки setup. Текущий snapshot следует исправленному контракту.<\/title>\n<rect class=\"card\" x=\"498\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"300\" font-size=\"20\" font-weight=\"650\">Передача setup-ошибок<\/text>\n<text class=\"muted\" x=\"518\" y=\"358\" font-size=\"14\">first rejected short setup mutation → stop<\/text>\n<text class=\"muted\" x=\"518\" y=\"403\" font-size=\"12\">3 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/include/portals/ui.hpp#L1980\" target=\"_blank\" rel=\"noopener\" data-node=\"launch-change\"><title>Ленивый CLI-запуск может показать справку без создания scene factory. Fluent stages по-прежнему подготавливают и запускают тот же retained core. Владение в одном UI-потоке, проверяемые observing handles, dirty-only frames и явный cleanup сохраняются как основные инварианты.<\/title>\n<rect class=\"card\" x=\"22\" y=\"270\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"270\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"42\" y=\"300\" font-size=\"20\" font-weight=\"650\">Ленивый запуск и retained core<\/text>\n<text class=\"muted\" x=\"42\" y=\"358\" font-size=\"14\">ui::launch + same Application / tree /<\/text>\n<text class=\"muted\" x=\"42\" y=\"377\" font-size=\"14\">router<\/text>\n<text class=\"muted\" x=\"42\" y=\"403\" font-size=\"12\">4 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/planned-features.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"remaining\"><title>Эта исходная база не включает незакоммиченные range composition, named references/scoped style changes и последующую работу controls/focus. Их поставка и проверки учитываются отдельно. Обновляйте архитектуру по интегрированным проверенным исходникам; foundation не завершает весь milestone.<\/title>\n<rect class=\"card\" x=\"22\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"22\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"42\" y=\"490\" font-size=\"20\" font-weight=\"650\">M1 остаётся в работе<\/text>\n<text class=\"muted\" x=\"42\" y=\"548\" font-size=\"14\">Concurrent and future changes require a<\/text>\n<text class=\"muted\" x=\"42\" y=\"567\" font-size=\"14\">new snapshot<\/text>\n<text class=\"muted\" x=\"42\" y=\"593\" font-size=\"12\">5 · status · source ↗<\/text><\/a>\n<a href=\"https://github.com/ttldtor/portals/blob/968651a90b6a1542fd3ab2cec159b457e548681f/docs/testing.md#L1\" target=\"_blank\" rel=\"noopener\" data-node=\"checks\"><title>Интеграция базы: PR36 CI run 38799649714 завершил 6/6 проверок успешно для PR head 28723ed04810c597c2fe31f0d75cd9416c5916ac, слитого как 968651a. Отдельно при подготовке snapshot прошли 8 exporter/source/help tests и 40 offline browser combinations карт/языков/тем/ширины, включая реальные скачивания SVG. Это проверки документации, не новый C++ runtime suite. Новая полная Doxygen-сборка и поставленный артефакт: NOT_VERIFIED на границе подготовки; интеграция обязательна.<\/title>\n<rect class=\"card\" x=\"498\" y=\"460\" width=\"440\" height=\"154\" rx=\"10\" stroke=\"#705400\" stroke-width=\"2\"/>\n<rect x=\"498\" y=\"460\" width=\"7\" height=\"154\" rx=\"3\" fill=\"#705400\"/>\n<text class=\"ink\" x=\"518\" y=\"490\" font-size=\"20\" font-weight=\"650\">Доказательства проверок<\/text>\n<text class=\"muted\" x=\"518\" y=\"548\" font-size=\"14\">Baseline CI 6/6 / exporter 8 / browser 40<\/text>\n<text class=\"muted\" x=\"518\" y=\"593\" font-size=\"12\">6 · status · source ↗<\/text><\/a>\n<\/svg>\n"}};
let language = new URLSearchParams(location.search).get("lang") === "ru" ? "ru" : "en";
let selectedMap = snapshot.maps[0].id;
let selectedNode = snapshot.maps[0].nodes[0].id;
const strings = {
 en:{heading:"Portals architecture",intro:"Select a map and a node. Cards describe responsibilities; their order is a reading path, not an ownership arrow. Node buttons and SVG links work with Tab and Enter. The diagram scrolls horizontally on narrow screens.",source:"Pinned source",role:"Role",offline:"Offline: all maps and details are embedded. Source links open GitHub and require a connection. Downloaded SVGs work independently; maps.json is the readable authoring input.",theme:"Toggle light / dark",export:"Download SVG",maps:"Architecture maps",nodes:"Map nodes"},
 ru:{heading:"Архитектура Portals",intro:"Выберите карту и узел. Карточки показывают обязанности; порядок чтения не обозначает владение. Кнопки узлов и SVG-ссылки доступны через Tab и Enter. На узком экране схема прокручивается по горизонтали.",source:"Закреплённый исходник",role:"Роль",offline:"Автономный просмотр: карты и описания встроены. Ссылкам на GitHub требуется сеть. Скачанные SVG работают отдельно; maps.json содержит редактируемые данные.",theme:"Сменить светлую / тёмную тему",export:"Скачать SVG",maps:"Архитектурные карты",nodes:"Узлы карты"}
};
const byId = id => document.getElementById(id);
function chooseNode(id, focus = false) {
 const map = snapshot.maps.find(item => item.id === selectedMap);
 const node = map.nodes.find(item => item.id === id);
 selectedNode = id;
 byId("node-title").textContent = node.title[language];
 byId("detail").textContent = node.detail[language];
 byId("role").textContent = strings[language].role + ": " + node.kind + " · " + node.label;
 byId("source").textContent = strings[language].source + ": " + node.source.path + ":" + node.source.line;
 byId("source").href = "https://github.com/ttldtor/portals/blob/" + (node.source.revision || snapshot.revision) + "/" + node.source.path + "#L" + node.source.line;
 byId("evidence").replaceChildren(...(node.evidence || []).map(item => {
  const li = document.createElement("li"); const link = document.createElement("a");
  link.href = item.url; link.textContent = item.label[language]; link.target = "_blank"; link.rel = "noopener"; li.append(link); return li;
 }));
 byId("nodes").querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.node === id)));
 if (focus) byId("details").focus();
}
function render() {
 const text = strings[language];
 const map = snapshot.maps.find(item => item.id === selectedMap);
 document.documentElement.lang = language;
 byId("lang").value = language;
 byId("heading").textContent = text.heading;
 byId("status").textContent = snapshot.id + " · " + snapshot.status[language];
 byId("intro").textContent = text.intro;
 byId("theme").textContent = text.theme;
 byId("revision").textContent = "Source revision: " + snapshot.revision;
 byId("offline").textContent = text.offline;
 byId("maps").setAttribute("aria-label",text.maps);
 byId("nodes").setAttribute("aria-label",text.nodes);
 byId("maps").replaceChildren(...snapshot.maps.map(item => {
  const button = document.createElement("button"); button.type = "button";
  button.textContent = item.title[language]; button.dataset.map = item.id; button.setAttribute("aria-pressed",String(item.id === selectedMap));
  button.onclick = () => {selectedMap = item.id; selectedNode = item.nodes[0].id; render();byId("maps").querySelector('[data-map="'+selectedMap+'"]').focus();}; return button;
 }));
 byId("map-title").textContent = map.title[language];
 byId("map-intro").textContent = map.intro[language];
 byId("nodes").replaceChildren(...map.nodes.map((node,index) => {
  const button = document.createElement("button"); button.type = "button"; button.dataset.node = node.id;
  button.textContent = /^\d+\./.test(node.title[language]) ? node.title[language] : (index+1) + " · " + node.title[language]; button.onclick = () => chooseNode(node.id,true); return button;
 }));
 const svg = snapshot.svgs[map.id + "-" + language + ".svg"];
 byId("diagram").innerHTML = svg;
 byId("diagram").querySelectorAll("a[data-node]").forEach(link => link.onclick = event => {event.preventDefault();chooseNode(link.dataset.node,true);});
 byId("export").href = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
 byId("export").download = snapshot.id + "-" + map.id + "-" + language + ".svg";
 byId("export").textContent = text.export;
 chooseNode(selectedNode);
}
byId("lang").onchange = event => {language = event.target.value;render();};
byId("theme").onclick = () => {
 const current = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
 document.documentElement.dataset.theme = current === "dark" ? "light" : "dark";
};
render();
