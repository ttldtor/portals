<style>text{font-family:Arial,sans-serif;fill:#183247} .title{font-size:25px;font-weight:bold} .label{font-size:17px;font-weight:bold} .detail{font-size:14px} .edge{fill:none;stroke:#365b78;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1000" height="650" fill="#f7f9fc"/>
<text x="36" y="42" class="title">Ownership, borrows and retained snapshots</text>
