name: Warm naming package cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/actions/naming-toolchain/**'
      - '.github/workflows/cache-naming.yml'
      - 'tools/ci/apt_cache.py'

permissions:
  contents: read

concurrency:
  group: naming-package-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Main's cache scope is readable by subsequent PRs; no project checks run here.
      - uses: ./.github/actions/naming-toolchain
