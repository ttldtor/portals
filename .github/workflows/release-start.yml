name: Start merged release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-start-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'task/PRTLS-') &&
      contains(github.event.pull_request.head.ref, '-BUILD-prepare-release-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the merge commit from the trusted base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate merged release, create its tag and dispatch publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/start.py --dispatch-merged "$GITHUB_EVENT_PATH"
