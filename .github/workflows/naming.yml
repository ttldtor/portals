name: Full naming check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: full-naming-${{ github.ref }}
  cancel-in-progress: false

jobs:
  naming:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/naming-toolchain
      - name: Test naming runner and dependency selection
        run: python3 -m unittest tools.test_check_naming tools.ci.test_naming_selection -v
      - name: Configure compilation database
        run: >-
          cmake -S . -B build/naming -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-20
          -DCMAKE_CXX_COMPILER=clang++-20
          -DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DPORTALS_BUILD_TESTS=ON
          -DPORTALS_BUILD_EXAMPLES=ON
      - name: Check all project names
        run: python3 tools/check_naming.py build/naming --clang-tidy clang-tidy-20 --jobs 2 --timings build/naming/timings.json
      - name: Save naming timings
        if: ${{ always() && hashFiles('build/naming/timings.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naming-timings
          path: build/naming/timings.json
          if-no-files-found: error
          retention-days: 14
